[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-drift"
version = "0.1.0"
description = "Detect drift between Markdown code examples and the actual codebase. Read-only, deterministic, no LLM."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
doc-drift = "dep_drift.cli:main"
